[project]
name = "soliddata_mcp_poc"
version = "0.1.0"
description = "CrewAI POC — agent that uses SolidData MCP (text2sql, glossary_search, specific_asset_information, semantic_model_qa)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.9.3",
    "mcp",
    "httpx",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "snowflake-connector-python>=3.0",
    "nest-asyncio>=1.6.0",
]

[project.scripts]
soliddata_mcp_poc = "soliddata_mcp_poc.main:run"
run_crew = "soliddata_mcp_poc.main:run"
solid_multi_model_crew = "solid_multi_model_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soliddata_mcp_poc", "solid_multi_model_crew", "solid_mcp_tool"]

[tool.crewai]
type = "crew"
